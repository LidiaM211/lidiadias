# O que defendes
crencas:
  - titulo: "Content can generate leads, not only awareness."
    texto: "If a B2B company treats content as a brand exercise only, it’s leaving pipeline on the table."
  - titulo: "B2B doesn’t have to be boring."
    texto: "A serious product can still be explained in a relaxed, human way, without losing the substance."
  - titulo: "Use the customer’s words."
    texto: "Most B2B marketers are so immersed in their own product and jargon that they forget how the customer actually talks."
  - titulo: "AI will change what the job is."
    texto: "Writers will need to think like strategists and see content as a whole system. I’ve already made that shift."

